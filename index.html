<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#ffe1ee" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>💗</text></svg>" />
<title>抱抱宝宝</title>
<style>
  :root{ --accent:#ff4f86; --accent2:#ff8ab5; --accent-deep:#c93a70; --ink:#8f3557; --glow:rgba(255,79,134,.38); }
  body.mode-angry{ --accent:#ff7a3d; --accent2:#ffb36b; --accent-deep:#d0562a; --ink:#8f4a2c; --glow:rgba(255,122,61,.38); }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:radial-gradient(120% 70% at 50% -10%, #ffffff 0%, rgba(255,255,255,0) 55%),radial-gradient(90% 60% at 12% 102%, #ffd0e4 0%, rgba(255,208,228,0) 62%),radial-gradient(90% 60% at 92% 92%, #ffc0da 0%, rgba(255,192,218,0) 60%),linear-gradient(165deg,#fff6fa 0%,#ffe1ee 46%,#ffc9de 100%);
    color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:background .6s ease;}
  body.mode-angry{background:radial-gradient(120% 70% at 50% -10%, #fffdfb 0%, rgba(255,255,255,0) 55%),radial-gradient(90% 60% at 12% 102%, #ffd9c2 0%, rgba(255,217,194,0) 62%),radial-gradient(90% 60% at 92% 92%, #ffc9b0 0%, rgba(255,201,176,0) 60%),linear-gradient(165deg,#fff8f2 0%,#ffe8da 46%,#ffd6c2 100%);}

  .bg-hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1;}
  .bh{position:absolute;bottom:-12vh;opacity:0;white-space:nowrap;animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite;will-change:transform,opacity;}
  @keyframes rise{0%{transform:translate3d(0,0,0) scale(.7);opacity:0;}12%{opacity:.8;}85%{opacity:.45;}100%{transform:translate3d(var(--dx,0px),-120vh,0) scale(1.05);opacity:0;}}

  .topbar{position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;z-index:15;display:flex;justify-content:center;pointer-events:none;}
  .seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.78);border:1.5px solid rgba(255,255,255,.9);box-shadow:0 8px 22px rgba(214,79,126,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto;}
  .seg-btn{appearance:none;border:0;background:transparent;cursor:pointer;padding:8px 15px;border-radius:999px;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.03em;color:#c2799a;transition:background .25s,color .25s,transform .15s,opacity .2s;}
  .seg-btn:active{transform:scale(.96);}
  .seg-btn.on{color:#fff;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 6px 14px var(--glow);}
  .seg-btn[disabled]{opacity:.35;pointer-events:none;}
  .seg.small .seg-btn{padding:7px 11px;font-size:12px;}

  .app{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(52px + env(safe-area-inset-top)) 16px calc(8px + env(safe-area-inset-bottom));text-align:center;animation:fadeUp .8s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .kicker{margin:0 0 2px;font-size:10px;letter-spacing:.3em;color:#d4759a;text-transform:uppercase;}
  .title{margin:2px 0 0;font-size:clamp(22px,6.6vw,32px);font-weight:800;letter-spacing:.14em;color:var(--accent-deep);text-shadow:0 1px 0 #fff,0 8px 22px rgba(201,58,112,.2);}

  .stage{position:relative;display:flex;align-items:center;justify-content:center;height:min(38vh,320px);margin:2px 0 0;cursor:pointer;}
  .stage img{max-height:100%;max-width:min(80vw,320px);object-fit:contain;filter:drop-shadow(0 16px 22px rgba(120,60,90,.22));transition:transform .25s ease;transform-origin:50% 90%;}
  .stage img.react{animation:reactIn .42s cubic-bezier(.34,1.56,.64,1);max-height:92%;}
  @keyframes reactIn{0%{opacity:.2;transform:scale(.86) translateY(6px);}60%{opacity:1;transform:scale(1.04);}100%{transform:scale(1);}}
  .stage.pop img{animation:popIt .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes popIt{0%{transform:scale(1);}45%{transform:scale(1.08) rotate(-1.5deg);}100%{transform:scale(1);}}
  .stage.hit{animation:shake .5s cubic-bezier(.36,.07,.19,.97);}
  @keyframes shake{0%,100%{transform:translate(0,0) rotate(0);}10%{transform:translate(-11px,5px) rotate(-2.4deg);}25%{transform:translate(10px,-6px) rotate(2.4deg);}40%{transform:translate(-8px,4px) rotate(-1.8deg);}55%{transform:translate(7px,-4px) rotate(1.8deg);}70%{transform:translate(-5px,2px) rotate(-1deg);}85%{transform:translate(3px,-1px) rotate(.6deg);}}

  .controls{display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 0 0;flex-wrap:wrap;}
  .hint{margin:2px 0 0;font-size:10px;color:#cf86a6;letter-spacing:.02em;}

  .msg{margin:6px 0 0;min-height:1.6em;font-size:clamp(13px,3.8vw,15px);color:var(--ink);transition:opacity .18s;padding:0 6px;}
  .count{margin:0;height:20px;line-height:20px;font-size:11px;color:#c2567f;opacity:0;transition:opacity .3s;}
  .count.show{opacity:1;}
  .count b{font-size:14px;color:var(--accent);}
  body.mode-angry .count{display:none;}

  .meter{display:none;align-items:center;gap:8px;height:22px;}
  body.mode-angry .meter{display:flex;}
  .ventbar{width:120px;height:9px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.8);border:1.5px solid rgba(255,175,140,.9);}
  .ventbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffb36b,#ff6a3d);transition:width .25s cubic-bezier(.3,1.4,.6,1);}
  .ventnum{font-size:12px;color:#c2663a;font-weight:700;}

  .actions{display:none;gap:6px;margin:2px 0 0;flex-wrap:wrap;justify-content:center;}
  body.mode-angry .actions{display:flex;}
  .act{appearance:none;border:1.5px solid rgba(255,168,138,.9);background:rgba(255,255,255,.88);border-radius:999px;padding:9px 12px;font-family:inherit;font-size:12px;font-weight:700;color:#c2663a;cursor:pointer;min-height:40px;box-shadow:0 4px 10px rgba(255,120,60,.12);transition:transform .14s,background .2s;}
  .act:active{transform:scale(.94);background:#fff;}

  /* 主按钮 + 逗一下（大按钮，手机好点） */
  .btnrow{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;width:min(92vw,360px);margin:10px auto 0;}
  .btn{min-width:0;white-space:nowrap;appearance:none;border:0;outline:none;cursor:pointer;padding:15px 10px;border-radius:999px;font-size:16px;font-weight:700;font-family:inherit;color:#fff;letter-spacing:.04em;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 12px 26px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);animation:btnPulse 2.4s ease-in-out infinite;transition:transform .12s,background .4s;min-height:52px;}
  .btn:active{transform:scale(.95);}
  @keyframes btnPulse{0%,100%{box-shadow:0 12px 26px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);}50%{box-shadow:0 16px 36px var(--glow),inset 0 1px 0 rgba(255,255,255,.45);}}
  .btn.forgive{background:linear-gradient(135deg,#8ee7b0,#35c27a);box-shadow:0 12px 26px rgba(53,194,122,.4);animation:forgivePulse 1.1s ease-in-out infinite;}
  @keyframes forgivePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.045);}}

  .tease{min-width:0;white-space:nowrap;appearance:none;cursor:pointer;padding:13px 10px;border-radius:999px;font-size:15px;font-weight:800;font-family:inherit;color:#d9437a;letter-spacing:.04em;border:2.5px dashed #ff9dc0;background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(255,120,170,.22);min-height:52px;animation:teasePulse 1.8s ease-in-out infinite;transition:transform .12s;}
  .tease:active{transform:scale(.94);}
  @keyframes teasePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}

  .foot{margin:8px 0 0;display:flex;gap:16px;align-items:center;font-size:11px;color:#cf86a6;}
  .foot button{appearance:none;border:0;background:none;cursor:pointer;font-size:19px;line-height:1;padding:6px;filter:drop-shadow(0 2px 3px rgba(255,120,170,.3));transition:transform .15s;}
  .foot button:active{transform:scale(.85);}

  .letter{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(255,214,231,.42);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s;}
  .letter.open{opacity:1;pointer-events:auto;}
  .letter-card{width:min(92vw,380px);margin-bottom:calc(16px + env(safe-area-inset-bottom));background:#fff8fc;border:1.5px solid #ffd3e5;border-radius:24px;padding:20px 22px 14px;text-align:center;box-shadow:0 -10px 40px rgba(214,79,126,.28);transform:translateY(112%);transition:transform .5s cubic-bezier(.22,1.25,.36,1);}
  .letter.open .letter-card{transform:translateY(0);}
  .letter-seal{font-size:30px;line-height:1;margin-bottom:2px;}
  .letter-card h2{margin:0 0 8px;font-size:18px;letter-spacing:.18em;color:var(--accent-deep);font-weight:800;}
  .letter-card p{margin:0 0 8px;font-size:13.5px;line-height:1.8;color:#a8456a;}
  .letter-card .sign{margin:4px 0 10px;font-size:12px;color:#c2567f;text-align:right;}
  .letter-close{appearance:none;border:0;cursor:pointer;width:100%;padding:12px 0;border-radius:999px;font-size:15px;font-weight:700;color:#fff;font-family:inherit;background:linear-gradient(135deg,#ff8ab5,#ff4f86);}

  .burst{position:fixed;z-index:30;pointer-events:none;animation-name:burst;animation-timing-function:cubic-bezier(.17,.67,.32,1.1);animation-fill-mode:forwards;}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(.3);opacity:0;}15%{opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot,0deg));opacity:0;}}
  .hammer{position:fixed;z-index:31;pointer-events:none;font-size:34px;transform-origin:80% 90%;animation:swing .42s ease-out forwards;filter:drop-shadow(0 4px 6px rgba(180,60,20,.35));}
  @keyframes swing{0%{transform:rotate(-55deg) scale(.5);opacity:0;}35%{transform:rotate(-15deg) scale(1);opacity:1;}100%{transform:rotate(30deg) scale(1.05);opacity:0;}}
  .float-txt{position:fixed;z-index:32;pointer-events:none;font-weight:900;font-size:26px;color:#fff;-webkit-text-stroke:2px #e8467b;filter:drop-shadow(0 3px 8px rgba(255,60,110,.35));animation:floatTxt .8s ease-out forwards;}
  @keyframes floatTxt{0%{transform:translate(-50%,-50%) scale(.5);opacity:0;}22%{transform:translate(-50%,-58%) scale(1.18);opacity:1;}100%{transform:translate(-50%,-135%) scale(1);opacity:0;}}
  .flash{position:fixed;inset:0;z-index:29;pointer-events:none;background:#fff;opacity:0;animation:flash .3s ease-out;}
  @keyframes flash{0%{opacity:.55;}100%{opacity:0;}}

  @media (max-height:720px){
    .stage{height:min(33vh,250px);}
    .title{font-size:21px;}
    .kicker{display:none;}
    .hint{display:none;}
  }
</style>
</head>
<body class="mode-love">

  <main class="app">

      <button class="letter-close" id="letterClose" type="button">收下啦</button>
    </div>
  </div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var body = document.body,
      stage = $('stage'), charImg = $('charImg'),
      msgEl = $('msg'), actionBtn = $('actionBtn'),
      countEl = $('count'), countNum = $('countNum'),
      ventFill = $('ventfill'), ventNum = $('ventnum'),
      titleEl = $('title'), kickerEl = $('kicker'),
      modeSeg = $('modeSeg'), whoSeg = $('whoSeg'), outfitSeg = $('outfitSeg'),

  var S = { mode:'love', who:'girl', outfit:{girl:'a', boy:'a'}, hugs:0, vent:0, muted:false };

  function lsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }

  S.hugs = parseInt(lsGet('hbHugs','0'),10) || 0;
  S.vent = Math.min(VENT_MAX, parseInt(lsGet('hbVent','0'),10) || 0);

    'boy-a':'art/web/boy-hanfu-clean.webp',   'boy-b':'art/web/boy-vest-clean.webp'
  };
  var EXPR = {
    'girl-a': ["art/expr2/girl-a-0.webp","art/expr2/girl-a-1.webp","art/expr2/girl-a-2.webp","art/expr2/girl-a-3.webp","art/expr2/girl-a-4.webp","art/expr2/girl-a-5.webp","art/expr2/girl-a-6.webp","art/expr2/girl-a-7.webp","art/expr2/girl-a-8.webp"], 'girl-b': ["art/expr/girl-0.webp","art/expr/girl-1.webp","art/expr/girl-2.webp","art/expr/girl-3.webp","art/expr/girl-4.webp","art/expr/girl-5.webp","art/expr/girl-6.webp","art/expr/girl-7.webp","art/expr/girl-8.webp"],
    'boy-a':  ["art/expr2/boy-a-0.webp","art/expr2/boy-a-1.webp","art/expr2/boy-a-2.webp","art/expr2/boy-a-3.webp","art/expr2/boy-a-4.webp","art/expr2/boy-a-5.webp","art/expr2/boy-a-6.webp","art/expr2/boy-a-7.webp","art/expr2/boy-a-8.webp"], 'boy-b':  ["art/expr/boy-0.webp","art/expr/boy-1.webp","art/expr/boy-2.webp","art/expr/boy-3.webp","art/expr/boy-4.webp","art/expr/boy-5.webp","art/expr/boy-6.webp","art/expr/boy-7.webp","art/expr/boy-8.webp"]
  };
  var CRY = {
    'girl-a':'art/cry/girl-a.webp', 'girl-b':'art/cry/girl-b.webp',
    'boy-a':'art/cry/boy-a.webp',  'boy-b':'art/cry/boy-b.webp'
  };
  var KISS = {
    'girl-a':'art/kiss/kiss-girl-a.webp', 'girl-b':'art/kiss/kiss-girl-b.webp',
    'boy-a':'art/kiss/kiss-boy-a.webp',  'boy-b':'art/kiss/kiss-boy-b.webp'
  };
  var WAVE = { 'boy-b':'art/kiss/wave-boy-b.webp' };
  var OUTFIT_LABEL = { girl:{a:'汉服', b:'校服'}, boy:{a:'汉服', b:'马甲'} };

  var bg = $('bgHearts');
  var loveSym = ['💗','🩷','❤️','💕','✨','💞'];
  var angrySym = ['💢','😤','✨','💥','💫'];
  var bhEls = [];
  for (var i=0;i<16;i++){
    var h = document.createElement('span');
    h.className='bh';
    h.textContent = loveSym[i%loveSym.length];
    h.style.left = (Math.random()*100).toFixed(2)+'vw';
    h.style.fontSize = (11+Math.random()*18).toFixed(1)+'px';
    h.style.animationDuration = (10+Math.random()*9).toFixed(2)+'s';
    h.style.animationDelay = (-Math.random()*18).toFixed(2)+'s';
    h.style.setProperty('--dx',(Math.random()*90-45).toFixed(1)+'px');
    bg.appendChild(h); bhEls.push(h);
  }
  function paintBg(m){
    var set = m==='angry'?angrySym:loveSym;
    for (var i=0;i<bhEls.length;i++) bhEls[i].textContent = set[i%set.length];
  }

  var AC = null;
  function ac(){
    if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
    if (AC && AC.state === 'suspended') { try{ AC.resume(); }catch(e){} }
    return AC;
  }
  function tone(f1, f2, dur, type, vol){
    var c = ac(); if (!c || S.muted) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, vol, freq){

    var len = Math.max(1, Math.floor(c.sampleRate * dur));
    var buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (var i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq || 1400;
    var g = c.createGain(); g.gain.value = vol || 0.25;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  }

  function sfxHug(){ tone(520,880,0.18,'sine',0.12); setTimeout(function(){ tone(780,1180,0.2,'sine',0.07); },60); }
  function sfxKiss(){ tone(900,1500,0.16,'sine',0.09); }
  function sfxHit(){ noise(0.13,0.4,900); tone(150,55,0.2,'sine',0.32); }
  function sfxCry(){ tone(600,220,0.5,'triangle',0.14); }
  function sfxForgive(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ tone(f,0,0.22,'sine',0.1); }, i*110); }); }
  function sfxTight(){ tone(300,760,0.3,'triangle',0.12); }

  function spawn(cls, x, y, emoji, size, dur, extra){
    var s = document.createElement('span');
    s.className = cls; s.textContent = emoji;
    s.style.left = x+'px'; s.style.top = y+'px'; s.style.fontSize = size+'px'; s.style.animationDuration = dur+'s';
    if (extra) extra(s);
    document.body.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, (dur+0.5)*1000);
  }
  function burst(x,y,n,kind){
    var set = kind==='hit' ? ['💥','⭐','✨','💫','🌟'] : ['❤️','💗','🩷','💕','✨','💞'];
    for (var i=0;i<n;i++){
      (function(){
        var a = Math.random()*Math.PI*2, d = 70+Math.random()*150;
        spawn('burst', x, y, set[Math.floor(Math.random()*set.length)],
          (14+Math.random()*16).toFixed(1), (0.7+Math.random()*0.45).toFixed(2), function(el){
            el.style.setProperty('--dx',(Math.cos(a)*d).toFixed(1)+'px');
            el.style.setProperty('--dy',(Math.sin(a)*d-40).toFixed(1)+'px');
            el.style.setProperty('--rot',(Math.random()*120-60).toFixed(0)+'deg');
          });
      })();
    }
  }
  function floatTxt(x,y,text){
    var s = document.createElement('span');
    s.className='float-txt'; s.textContent=text;
    s.style.left=x+'px'; s.style.top=(y-64)+'px';
    document.body.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 950);
  }
  function hammer(x,y){
    var s = document.createElement('span');
    s.className='hammer'; s.textContent='🔨';
    s.style.left=(x+26)+'px'; s.style.top=(y-52)+'px';
    document.body.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 600);
  }
  function flash(){
    var s = document.createElement('div'); s.className='flash';
    document.body.appendChild(s);
    setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 380);
  }
  function vibrate(p){ if (navigator.vibrate){ try{ navigator.vibrate(p); }catch(e){} } }

  var loveMsgs = ['让我抱抱你～','抱紧一点点，再紧一点点','抱着你的时候，心跳好吵','今天也超级超级喜欢你','要一直一直这样抱着','你是我最软的那一块','抱抱可以治好所有不开心','有你在，哪里都是甜的'];
  var angryMsgs = ['对不起嘛，是我不好','别生气了，我错了','你怎么捶都行，别气坏自己','我保证，下次不这样了','你说什么都对，我都听','原谅我好不好','我给你买奶茶，加双份珍珠','抱抱我嘛，就一下'];
  var tightMsgs = ['抱紧你，不许跑！','再抱紧一点…','抱到你说喜欢我为止 😝','这次抱得久一点'];
  var hitWords = ['咚！','啪！','砰！','哼！'];
  var li=0, ai=0, ti=0;

  function setMsg(t){
    msgEl.style.opacity='0';
    setTimeout(function(){ msgEl.textContent=t; msgEl.style.opacity='1'; },140);
  }

  /* 表情：10 秒后回到全身像 */
  var reactTimer = null;
  function swapTo(src, ms){
    if (!src) return;
    if (reactTimer) clearTimeout(reactTimer);
    charImg.classList.remove('react');
    void charImg.offsetWidth;
    charImg.classList.add('react');
    charImg.src = src;
    reactTimer = setTimeout(function(){
      charImg.src = IMG[KEY()];
      charImg.classList.remove('react');
      reactTimer = null;
    }, ms || 10000);
  }
  function react(idx, ms){ var arr = EXPR[KEY()]; if (arr && arr[idx]) swapTo(arr[idx], ms); }
  function cry(ms){ swapTo(CRY[KEY()], ms); }
  function clearReact(){
    if (reactTimer){ clearTimeout(reactTimer); reactTimer = null; }
    charImg.classList.remove('react');
    charImg.src = IMG[KEY()];
  }

  function updateTitle(){
    if (S.mode==='love'){ titleEl.textContent='抱 抱 宝 宝'; kickerEl.textContent='To my favorite one'; }
    else { titleEl.textContent='别 生 气 了'; kickerEl.textContent="I'm really sorry"; }
    updateButton();
  }
  function updateButton(){
    if (S.mode==='love'){ actionBtn.textContent='抱抱我 🤗'; actionBtn.classList.remove('forgive'); }
    else if (S.vent>=VENT_MAX){ actionBtn.textContent='原谅你啦 ❤️'; actionBtn.classList.add('forgive'); }
    else { actionBtn.textContent='捶一下 🔨'; actionBtn.classList.remove('forgive'); }
  }
  function updateMeter(){
    ventFill.style.width = Math.min(100,(S.vent/VENT_MAX)*100)+'%';
    ventNum.textContent = S.vent+' / '+VENT_MAX;
    lsSet('hbVent', S.vent);
    updateButton();
  }
  function updateCount(){
    countNum.textContent = S.hugs;
    countEl.classList.toggle('show', S.hugs>0);
    lsSet('hbHugs', S.hugs);
  }
  function refreshImage(){
    clearReact();
    charImg.src = IMG[KEY()];
    charImg.style.transform = 'scale(.94)';
    setTimeout(function(){ charImg.style.transform = ''; }, 30);
    lsSet('hbWho', S.who);
    lsSet('hbOutfitGirl', S.outfit.girl);
    lsSet('hbOutfitBoy', S.outfit.boy);
    var ob = outfitSeg.querySelectorAll('.seg-btn');
    for (var i=0;i<ob.length;i++){
      var k = ob[i].getAttribute('data-outfit');
      ob[i].classList.toggle('on', k===S.outfit[S.who]);
      ob[i].textContent = OUTFIT_LABEL[S.who][k];
    }
  }
  function syncWho(){
    var wb = whoSeg.querySelectorAll('.seg-btn');
    for (var i=0;i<wb.length;i++){
      wb[i].classList.toggle('on', wb[i].getAttribute('data-who')===S.who);
      wb[i].disabled = (S.mode==='angry' && wb[i].getAttribute('data-who')==='girl');
    }
  }
  function syncMode(){
    var mb = modeSeg.querySelectorAll('.seg-btn');
    for (var i=0;i<mb.length;i++) mb[i].classList.toggle('on', mb[i].getAttribute('data-mode')===S.mode);
  }

  function setMode(m, silent){
    if (S.mode===m) return;
    S.mode = m;
    body.classList.toggle('mode-angry', m==='angry');
    if (m==='angry' && S.who!=='boy'){ S.who='boy'; refreshImage(); }
    syncWho(); syncMode(); updateTitle(); paintBg(m); updateMeter();
    stage.classList.remove('pop'); void stage.offsetWidth; stage.classList.add('pop');
    if (!silent) setMsg(m==='love' ? '让我抱抱你～' : '对不起… 你先别气，捶我两下出出气');
  }
  function setWho(w){
    if (S.mode==='angry' && w==='girl') return;
    if (S.who===w) return;
    S.who = w; refreshImage(); syncWho();
    setMsg(w==='girl' ? '她在这里呀～' : '我在呢');
  }
  function setOutfit(o){
    if (S.outfit[S.who]===o) return;
    S.outfit[S.who] = o; refreshImage();
  }

  function centerOf(el){
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height*0.55 };
  }
  function popStage(){ stage.classList.remove('pop'); void stage.offsetWidth; stage.classList.add('pop'); }

  /* 表情索引：a=汉服套，b=校服/马甲套 */
  function facePat(){ return S.who==='girl' ? (KEY()==='girl-a'?0:0) : (KEY()==='boy-a'?1:0); }
  function faceHug(){ return S.who==='girl' ? 2 : 0; }
  function faceKiss(){ return S.who==='girl' ? (KEY()==='girl-a'?5:4) : (KEY()==='boy-a'?4:4); }
  function faceTight(){ return S.who==='girl' ? 1 : (KEY()==='boy-a'?2:0); }

  function patHead(x,y){
    burst(x,y,10,'heart'); popStage(); sfxPat(); vibrate(12);
    if (WAVE[KEY()]) swapTo(WAVE[KEY()], 10000); else react(facePat());
    setMsg(S.who==='girl' ? '摸摸头，真乖～' : '摸头杀…');
  }
  function kiss(x,y){
    if (S.hugs < 1){ setMsg('先抱一下嘛，抱过才能亲亲～'); vibrate(8); return; }
    burst(x,y,14,'heart');
    spawn('burst',x,y,'💋',36,0.9,function(el){
      el.style.setProperty('--dx','0px'); el.style.setProperty('--dy','-80px'); el.style.setProperty('--rot','-10deg');
    });
    popStage(); sfxKiss(); vibrate([10,30,10]); setMsg('么么哒 😘');
    swapTo(KISS[KEY()], 10000);
  }
  function tightHug(x,y){
    burst(x,y,30,'heart'); popStage(); sfxTight(); vibrate([14,40,20,40,14]);
    react(faceTight());
    ti=(ti+1)%tightMsgs.length; setMsg(tightMsgs[ti]);
    S.hugs+=2; updateCount();
  }
  function hug(x,y){
    tease = 0;
    burst(x,y,20,'heart'); popStage(); sfxHug(); vibrate(18);
    react(faceHug());
    li=(li+1)%loveMsgs.length; setMsg(loveMsgs[li]);
    S.hugs++; updateCount();
  }
  function smack(x,y){
    stage.classList.remove('hit'); void stage.offsetWidth; stage.classList.add('hit');
    hammer(x,y); burst(x,y,14,'hit'); flash(); sfxHit(); vibrate([25,35,25]);
    floatTxt(x,y,hitWords[Math.floor(Math.random()*hitWords.length)]);
    react(3, 10000);
    ai=(ai+1)%angryMsgs.length; setMsg(angryMsgs[ai]);
    S.vent=Math.min(VENT_MAX,S.vent+1); updateMeter();
    setTimeout(function(){ stage.classList.remove('hit'); },460);
    if (S.vent>=VENT_MAX) setTimeout(function(){ setMsg('我举着小牌牌：求原谅 🥺'); react(3, 10000); },300);
  }
  function combo(x,y){
    for (var i=0;i<3;i++){
      (function(k){
        setTimeout(function(){
          if (S.mode==='angry') smack(x+(Math.random()*30-15), y+(Math.random()*20-10));
        }, k*140);
      })(i);
    }
  }
  var acts = {
    kneel:{ emoji:'🧎', gain:2, msg:'我跪搓衣板了，膝盖都疼', face:6 },
    flower:{ emoji:'🌹', gain:2, msg:'给你花花，别气了嘛', face:0 },
    milk:{ emoji:'🧋', gain:2, msg:'奶茶加双份珍珠，马上送到', face:5 }
  };
  function doAct(key){
    var a = acts[key]; if (!a || S.mode!=='angry') return;
    var c = centerOf(stage);
    spawn('burst', c.x, c.y, a.emoji, 40, 1.0, function(el){
      el.style.setProperty('--dx','0px'); el.style.setProperty('--dy','-130px'); el.style.setProperty('--rot','0deg');
    });
    burst(c.x,c.y,6,'heart'); popStage(); sfxHug(); vibrate(15); setMsg(a.msg);
    react(a.face);
    S.vent=Math.min(VENT_MAX,S.vent+a.gain); updateMeter();
    if (S.vent>=VENT_MAX) setTimeout(function(){ setMsg('我举着小牌牌：求原谅 🥺'); react(3,10000); },320);
  }
  function forgive(){
    var c = centerOf(stage);
    burst(c.x,c.y,30,'heart'); popStage(); sfxForgive(); vibrate([10,30,10,30,10]);
    setMsg('原谅你啦，抱抱你 ❤️');
    react(0, 10000);
    S.vent=0; updateMeter();
    setTimeout(function(){ setMode('love',true); setMsg('让我抱抱你～'); openLetter(); },900);
  }

  /* 逗一下：先生气，再委屈，第三次哭（全身像） */
  var tease = 0, teaseTimer = null;
  var TEASE = {
    'girl-a': { chain:[3,4], msgs:['咦？你干嘛～','哼！再逗我要生气了','眼泪要掉下来了…'] },
    'girl-b': { chain:[8,3], msgs:['咦？你干嘛～','哼！再逗我要生气了','眼泪要掉下来了…'] },
    'boy-a':  { chain:[3,3], msgs:['别闹…','你欺负我…','呜呜，我错了还不行吗'] },
    'boy-b':  { chain:[2,2], msgs:['别闹…','你欺负我…','呜呜，我错了还不行吗'] }
  };
  function doTease(){
    var t = TEASE[KEY()];
    var k = Math.min(tease, 2);
    if (k >= 2){ cry(10000); sfxCry(); burst(centerOf(stage).x, centerOf(stage).y, 8, 'hit'); }
    else { react(t.chain[k], 10000); sfxPat(); burst(centerOf(stage).x, centerOf(stage).y, 6, 'hit'); }
    setMsg(t.msgs[k]);
    vibrate(10);
    tease = Math.min(tease + 1, 3);
    if (teaseTimer) clearTimeout(teaseTimer);
    teaseTimer = setTimeout(function(){ tease = 0; }, 6000);
  }

  function openLetter(){ if (letter.classList.contains('open')) return; letter.classList.add('open'); letter.setAttribute('aria-hidden','false'); lsSet('hbLetter','1'); }
  function closeLetter(){ letter.classList.remove('open'); letter.setAttribute('aria-hidden','true'); }

  modeSeg.addEventListener('click', function(e){
    var b = e.target.closest('.seg-btn'); if (b) setMode(b.getAttribute('data-mode'));
  });
  whoSeg.addEventListener('click', function(e){
    var b = e.target.closest('.seg-btn'); if (b) setWho(b.getAttribute('data-who'));
  });
  outfitSeg.addEventListener('click', function(e){
    var b = e.target.closest('.seg-btn'); if (b) setOutfit(b.getAttribute('data-outfit'));
  });
  $('letterClose').addEventListener('click', closeLetter);
  letter.addEventListener('click', function(e){ if (e.target===letter) closeLetter(); });

  $('soundBtn').addEventListener('click', function(){
    S.muted = !S.muted; lsSet('hbMuted', S.muted?'1':'0');
    this.textContent = S.muted ? '🔇' : '🔊';
    if (!S.muted) sfxHug();
  });

  $('teaseBtn').addEventListener('click', doTease);

  actionBtn.addEventListener('click', function(){
    var c = centerOf(stage);
    if (S.mode==='love') hug(c.x,c.y);
    else if (S.vent>=VENT_MAX) forgive();
    else smack(c.x,c.y);
  });
  $('actions').addEventListener('click', function(e){
    var b = e.target.closest('.act'); if (b) doAct(b.getAttribute('data-act'));
  });

  var pressTimer=null, longFired=false;
  function clearPress(){ if (pressTimer){ clearTimeout(pressTimer); pressTimer=null; } }
  stage.addEventListener('pointerdown', function(){
    longFired=false; clearPress();
    pressTimer=setTimeout(function(){
      longFired=true; pressTimer=null;
      var c=centerOf(stage);
      if (S.mode==='love') tightHug(c.x,c.y); else combo(c.x,c.y);
    },520);
  });
  stage.addEventListener('pointerup', clearPress);
  stage.addEventListener('pointerleave', clearPress);
  stage.addEventListener('pointercancel', clearPress);

  var lastTap = 0, tapTimer = null;
  stage.addEventListener('click', function(e){
    e.preventDefault();
    if (longFired){ longFired = false; return; }
    var c = centerOf(stage);
    if (S.mode !== 'love'){ smack(c.x, c.y); return; }
    var r = charImg.getBoundingClientRect();
    var relY = r.height ? (e.clientY - r.top) / r.height : 0.6;
    var now = Date.now();
    if (now - lastTap < 330){
      if (tapTimer){ clearTimeout(tapTimer); tapTimer = null; }
      lastTap = 0;
      kiss(c.x, c.y);
      return;
    }
    lastTap = now;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(function(){
      tapTimer = null;
      if (relY < 0.42) patHead(c.x, c.y); else hug(c.x, c.y);
    }, 300);
  });
  stage.addEventListener('keydown', function(e){
    if (e.key==='Enter'||e.key===' '){ e.preventDefault(); var c=centerOf(stage); if (S.mode==='love') hug(c.x,c.y); else smack(c.x,c.y); }
  });

  refreshImage(); syncWho(); syncMode(); updateTitle(); updateCount(); updateMeter();
  $('soundBtn').textContent = S.muted ? '🔇' : '🔊';

  (function(){
    var hp = (location.hash||'').replace('#','');
    if (!hp) return;
    var p = {}; hp.split('&').forEach(function(kv){ var a=kv.split('='); if (a[0]) p[a[0]]=a[1]; });
    if (p.mode==='angry') setMode('angry', true);
    if (p.who==='boy' || p.who==='girl') setWho(p.who);
    if (p.outfit==='a' || p.outfit==='b'){ S.outfit[S.who]=p.outfit; refreshImage(); }
    if (p.face){ react(parseInt(p.face,10) || 0, 999999); }
    if (p.cry==='1'){ cry(999999); }
  })();
})();
</script>
</body>
</html>
